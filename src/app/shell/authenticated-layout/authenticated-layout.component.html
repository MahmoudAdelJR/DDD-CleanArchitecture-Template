<a class="skip-link" href="#main">{{ 'nav.skipToContent' | tr }}</a>

<header class="app-bar">
  <div class="app-bar__brand">
    <span class="app-bar__title">{{ 'app.title' | tr }}</span>
    <nav class="app-bar__nav" [attr.aria-label]="'nav.primary' | tr">
      <a routerLink="/customers" routerLinkActive="active">{{ 'nav.customers' | tr }}</a>
      <a routerLink="/profile" routerLinkActive="active">{{ 'nav.profile' | tr }}</a>
    </nav>
  </div>

  <div class="app-bar__session">
    <app-locale-switcher />
    @if (user(); as signedInUser) {
      <span class="muted">{{ signedInUser.fullName }}</span>
      <button type="button" class="button button--secondary" (click)="signOut()">
        {{ 'nav.signOut' | tr }}
      </button>
    }
  </div>
</header>

<main id="main" class="app-content">
  <router-outlet />
</main>
