<section class="sign-in-card card">
  <h1>{{ 'auth.title' | tr }}</h1>

  @if (errorMessage(); as message) {
    <div class="error-banner" role="alert">{{ message }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="email">{{ 'auth.emailLabel' | tr }}</label>
      <input
        id="email"
        formControlName="email"
        type="email"
        autocomplete="username"
        [attr.aria-invalid]="isInvalid('email')"
        aria-describedby="email-errors"
        [appAutofocus]="true"
      />
      <app-field-error
        id="email-errors"
        [control]="form.controls.email"
        [show]="shouldShowFieldError('email')"
        [label]="'auth.emailLabel' | tr"
      />
    </div>

    <div class="field">
      <label for="password">{{ 'auth.passwordLabel' | tr }}</label>
      <input
        id="password"
        formControlName="password"
        type="password"
        autocomplete="current-password"
        [attr.aria-invalid]="isInvalid('password')"
        aria-describedby="password-errors"
      />
      <app-field-error
        id="password-errors"
        [control]="form.controls.password"
        [show]="shouldShowFieldError('password')"
        [label]="'auth.passwordLabel' | tr"
      />
    </div>

    <button class="button" type="submit" [disabled]="status() === 'submitting'">
      @if (status() === 'submitting') {
        {{ 'auth.submitting' | tr }}
      } @else {
        {{ 'auth.submit' | tr }}
      }
    </button>
  </form>

  @if (demoAccountHints.length > 0) {
    <div class="demo-accounts">
      <h2>{{ 'auth.demoTitle' | tr }}</h2>
      <ul>
        @for (account of demoAccountHints; track account.email) {
          <li>
            <strong>{{ account.email }}</strong> / {{ account.password }} —
            {{ account.labelKey | tr }}
          </li>
        }
      </ul>
    </div>
  }
</section>
