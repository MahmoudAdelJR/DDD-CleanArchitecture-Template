server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Container health check used by the Dockerfile HEALTHCHECK.
    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # Application entry: never cache the HTML so deploys take effect
    # immediately; hashed asset references inside it stay immutable.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Deployment-time configuration must never be cached. The nginx image
    # writes this file from environment variables on each container start.
    location = /config/app-config.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Hashed build outputs (main-HASH.js, chunk-HASH.js, styles-HASH.css).
    location ~* \.(js|css)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Static files that are not content-hashed.
    location = /favicon.ico {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # SPA fallback: deep links resolve client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
