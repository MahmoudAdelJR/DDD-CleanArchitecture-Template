# Security headers applied to every response. Re-include inside any location
# block that sets its own add_header directives (nginx does not inherit
# add_header when a block declares its own).

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Frame-Options "DENY" always;

# Angular's default build injects component styles as <style> tags at runtime,
# so style-src needs 'unsafe-inline' unless styles: { inlineCritical: false }
# and extractStyles are configured to emit only hashed CSS files.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

# Enable once served over TLS (typically also at the load balancer):
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
